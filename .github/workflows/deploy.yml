name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          PUBLIC_AGENTIC_SUPPORT_API_URL: ${{ vars.PUBLIC_AGENTIC_SUPPORT_API_URL }}
          PUBLIC_STAFF_AUTH_TENANT_ID: ${{ vars.PUBLIC_STAFF_AUTH_TENANT_ID }}
          PUBLIC_STAFF_AUTH_WEB_CLIENT_ID: ${{ vars.PUBLIC_STAFF_AUTH_WEB_CLIENT_ID }}
          PUBLIC_STAFF_AUTH_API_SCOPE: ${{ vars.PUBLIC_STAFF_AUTH_API_SCOPE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
